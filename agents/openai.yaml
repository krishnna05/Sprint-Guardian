interface:
  display_name: "Sprint Guardian"
  short_description: "Guide Sprint Guardian sprint flow with approval gates"
  default_prompt: "Use $sprint-guardian to shape Sprint Guardian sprint scope, triage queues, balance load, inspect sprint health, surface risks, create progress, standup, and retro summaries, and keep owner changes approval-gated."

dependencies:
  tools:
    - type: "mcp"
      value: "mcp-atlassian"
      description: "Atlassian MCP tools for Jira and Confluence operations"

policy:
  allow_implicit_invocation: true
